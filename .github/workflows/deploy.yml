name: Deploy Miranda Backend

on:
  push:
    branches:
      - main  # O la rama que utilices para el despliegue

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js (Required for Serverless Framework)
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install Serverless Framework
        run: npm install -g serverless

      - name: Install dependencies
        run: npm install

      - name: Build Vite App
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          SOURCE_DIR: 'dist'

      - name: Set up environment variables
        run: |
          echo "TOKEN_SECRET=${{ secrets.TOKEN_SECRET }}" >> $GITHUB_ENV
          echo "MONGO_KEY=${{ secrets.MONGO_KEY }}" >> $GITHUB_ENV

      - name: Deploy with Serverless
        run: serverless deploy
